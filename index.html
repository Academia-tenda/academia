<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="color-scheme" content="dark">
<title>Academia</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:10;background:#0f172a;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px 16px 10px}
h1{margin:0;font-size:17px;letter-spacing:4px;font-weight:800}
h1 span{color:#22c55e}
.topo{display:flex;gap:8px;align-items:center}
.btn{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn.acc{background:#22c55e;border-color:#22c55e;color:#052e16}
.btn.warn{color:#fbbf24;border-color:#78590f}
.btn.av{border-radius:50%;width:38px;height:38px;padding:0;background:#22c55e;border-color:#22c55e;color:#052e16;font-weight:800;font-size:16px}
nav{display:flex;gap:8px;padding:4px 16px 0}
.aba{flex:1;padding:12px 0;font-size:15px;font-weight:700;background:#1e293b;border:1px solid #334155;color:#94a3b8;border-radius:12px 12px 0 0;cursor:pointer;font-family:inherit}
.aba.ativa{background:#22c55e;border-color:#22c55e;color:#052e16}
.progresso{margin:16px;padding:14px;background:#1e293b;border:1px solid #334155;border-radius:14px}
.nomeTreino{font-size:14px;font-weight:700;margin-bottom:10px;color:#e2e8f0}
.barra{height:10px;background:#0f172a;border-radius:99px;overflow:hidden}
#barraFill{height:100%;width:0;background:linear-gradient(90deg,#16a34a,#4ade80);border-radius:99px;transition:width .3s}
.ptxt{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:13px;color:#94a3b8}
.cardio{margin:0 16px;padding:10px 14px;background:#172033;border:1px solid #334155;border-radius:12px;font-size:13px;color:#94a3b8;line-height:1.45}
.cardio b{color:#fbbf24}
#lista{list-style:none;margin:14px 16px 0;padding:0;display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:10px;background:#1e293b;border:1px solid #334155;border-radius:14px;padding:12px 14px}
.check{width:28px;height:28px;min-width:28px;border-radius:50%;border:2px solid #475569;background:transparent;color:transparent;font-size:15px;font-weight:900;cursor:pointer;line-height:1;padding:0;font-family:inherit}
.item.done .check{background:#22c55e;border-color:#22c55e;color:#052e16}
.info{flex:1;min-width:0}
.nome{font-size:15px;font-weight:600;line-height:1.3;word-break:break-word}
.linha2{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.meta{font-size:12.5px;color:#94a3b8;margin-top:3px}
.item.done .nome{color:#64748b;text-decoration:line-through}
.histbtn{background:none;border:1px solid #78590f;color:#fbbf24;border-radius:99px;padding:1px 9px;font-size:11.5px;cursor:pointer;font-family:inherit;margin-top:3px}
.histbtn:active{transform:scale(.96)}
.seriespeso{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.sp{display:flex;align-items:center;gap:5px;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:4px 7px}
.sp b{font-size:11px;color:#64748b;font-weight:700}
.sp input{width:50px;background:transparent;border:none;color:#fbbf24;font-size:14px;text-align:right;padding:2px 1px;font-family:inherit;min-width:0}
.sp input:focus{outline:none}
.sp input::placeholder{color:#475569}
.sp:focus-within{border-color:#f59e0b}
.edicao{display:none;flex:1;flex-direction:column;gap:8px}
body.editando .check,body.editando .info,body.editando .seriespeso{display:none}
body.editando .edicao{display:flex}
.linha1{display:flex;gap:8px}
.edicao input{background:#0f172a;border:1px solid #475569;color:#e2e8f0;border-radius:9px;padding:9px 10px;font-size:14px;font-family:inherit;min-width:0}
.edicao input:focus{outline:none;border-color:#22c55e}
.edicao .nomei{width:100%}
.edicao .s{width:54px}
.edicao .r{width:78px}
.thumb{width:48px;height:48px;min-width:48px;border-radius:10px;overflow:hidden;border:1px solid #334155;background:#0f172a;padding:0;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
body.editando .thumb{display:none}
.foto{background:none;border:1px solid #334155;color:#cbd5e1;border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer;align-self:flex-end;font-family:inherit}
.delFoto{border-color:#7f1d1d;color:#f87171}
#modalImg .caixa{max-width:540px;width:min(92vw,540px)}
#imgGrande{max-width:100%;max-height:64vh;border-radius:12px;display:block;margin:0 auto 12px}
#imgLegenda{text-align:center;font-size:12px;margin-bottom:10px}
.del{background:none;border:1px solid #7f1d1d;color:#f87171;border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer;align-self:flex-end;font-family:inherit}
.vazio{padding:30px 16px;text-align:center;color:#64748b;background:#1e293b;border:1px dashed #334155;border-radius:14px;font-size:14px;line-height:1.6}
#btnAdicionar{display:none;width:calc(100% - 32px);margin:12px 16px 0;padding:13px 0;font-size:15px;justify-content:center}
body.editando #btnAdicionar{display:flex}
#btnModelo{display:none;width:calc(100% - 32px);margin:10px 16px 0;padding:13px 0;font-size:14.5px;background:#1e293b;color:#94a3b8}
body.editando #btnModelo{display:block}
.rodape{margin:18px 16px 0}
.rodape .btn{width:100%;padding:13px 0;font-size:14.5px}
.overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.overlay[hidden]{display:none}
.caixa{background:#1e293b;border:1px solid #334155;border-radius:18px;padding:22px;width:100%;max-width:380px;max-height:86vh;overflow:auto}
.caixa h2{margin:0 0 16px;font-size:17px}
.caixa input{width:100%;background:#0f172a;border:1px solid #475569;color:#e2e8f0;border-radius:10px;padding:12px;font-size:15px;margin-bottom:10px;font-family:inherit}
.caixa input:focus{outline:none;border-color:#22c55e}
.btn.google{width:100%;background:#fff;color:#1f2937;border-color:#fff;margin-bottom:12px;padding:12px}
.divis{display:flex;align-items:center;gap:10px;color:#64748b;font-size:12.5px;margin:2px 0 14px}
.divis::before,.divis::after{content:'';flex:1;height:1px;background:#334155}
.erro{color:#f87171;font-size:13px;margin-bottom:8px;min-height:15px}
#btnEmail{width:100%;padding:12px;margin-bottom:6px}
.link{display:block;width:100%;background:none;border:none;color:#60a5fa;font-size:14px;padding:8px;cursor:pointer;font-family:inherit}
.link.fraco{color:#64748b;font-size:13px}
.avatar{width:56px;height:56px;border-radius:50%;background:#22c55e;color:#052e16;font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
#perfilNome{font-weight:700;text-align:center;margin-bottom:2px}
.muted{color:#94a3b8;font-size:13.5px;text-align:center;word-break:break-word}
#btnSair{width:100%;margin:16px 0 4px;padding:12px}
.histlista{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.histlinha{display:flex;justify-content:space-between;gap:10px;background:#0f172a;border:1px solid #334155;border-radius:10px;padding:10px 12px;font-size:14px}
.histlinha .d{color:#94a3b8}
.histlinha .p{font-weight:700}
.histlinha .up{color:#4ade80;font-weight:700}
.histlinha .down{color:#f87171;font-weight:700}
.histlinha .flat{color:#64748b}
#btnFecharHist{width:100%;padding:12px}
.aviso{margin:0 16px;padding:10px 14px;background:#3b2f0b;border:1px solid #78590f;border-radius:12px;font-size:13px;color:#fbbf24;line-height:1.45}
.aviso[hidden]{display:none}
</style>
</head>
<body>
<header>
  <h1>ACADEM<span>IA</span></h1>
  <div class="topo">
    <button class="btn acc" id="btnInstalar" hidden>Instalar</button>
    <button class="btn" id="btnEditar" hidden>Editar</button>
    <button class="btn" id="btnConta" hidden>Entrar</button>
  </div>
</header>
<nav id="abas">
  <button class="aba ativa" data-t="A">A</button>
  <button class="aba" data-t="B">B</button>
  <button class="aba" data-t="C">C</button>
  <button class="aba" data-t="D">D</button>
  <button class="aba" data-t="E">E</button>
</nav>
<section class="progresso">
  <div class="nomeTreino" id="nomeTreino">Treino A — Peito e Ombros</div>
  <div class="barra"><div id="barraFill"></div></div>
  <div class="ptxt"><span id="progTexto">0/0 (0%)</span><span id="dataTexto"></span></div>
</section>
<div class="cardio">Cardio: <b>20 min todos os dias</b> — bike, passadeira ou elíptico</div>
<div class="aviso" id="avisoConta" hidden>Login indisponível no momento — os dados continuam salvos neste celular.</div>
<ul id="lista"></ul>
<button class="btn acc" id="btnAdicionar">+ Adicionar exercício</button>
<button class="btn" id="btnModelo">Carregar modelo (A–E)</button>
<div class="rodape"><button class="btn warn" id="btnLimpar">Limpar marcações de hoje</button></div>

<div class="overlay" id="modalLogin" hidden>
  <div class="caixa">
    <h2>Entrar na conta</h2>
    <button class="btn google" id="btnGoogle">Entrar com Google</button>
    <div class="divis">ou</div>
    <input id="inEmail" type="email" placeholder="E-mail" autocomplete="email" inputmode="email">
    <input id="inSenha" type="password" placeholder="Senha" autocomplete="current-password">
    <input id="inNome" type="text" placeholder="Seu nome" autocomplete="name" hidden>
    <div class="erro" id="loginErro"></div>
    <button class="btn acc" id="btnEmail">Entrar</button>
    <button class="link" id="btnAlternar">Criar conta</button>
    <button class="link fraco" id="btnSemConta">Continuar sem conta</button>
  </div>
</div>

<div class="overlay" id="modalPerfil" hidden>
  <div class="caixa">
    <div class="avatar" id="perfilAvatar">U</div>
    <div id="perfilNome"></div>
    <div class="muted" id="perfilEmail"></div>
    <button class="btn warn" id="btnSair">Sair da conta</button>
    <button class="link" id="btnFecharPerfil">Fechar</button>
  </div>
</div>

<div class="overlay" id="modalHist" hidden>
  <div class="caixa">
    <h2 id="histTitulo">Evolução</h2>
    <div class="histlista" id="histLista"></div>
    <button class="btn" id="btnFecharHist">Fechar</button>
  </div>
</div>

<div class="overlay" id="modalImg" hidden>
  <div class="caixa">
    <img id="imgGrande" alt="">
    <div class="muted" id="imgLegenda"></div>
    <button class="btn" id="btnFecharImg">Fechar</button>
  </div>
</div>

<script src="firebase-config.js"></script>
<script>
const CHAVE='academia_v3';
const ORDEM=['A','B','C','D','E'];
const NOMES={A:'Peito e Ombros',B:'Costas e Posterior de Ombros',C:'Pernas',D:'Braços',E:'Full Body'};
const PADRAO={
A:[['Peck deck','4','12'],['Supino com halteres','4','12'],['Supino inclinado com barra','4','12'],['Flexão no chão','3','20'],['Desenvolvimento militar','3','12'],['Elevação lateral','3','12'],['Elevação frontal','3','12']],
B:[['Barra fixa','3','10'],['Puxada alta','4','12'],['Remada baixa','4','12'],['Remada unilateral (mais peso)','3','8'],['Encolhimento','4','20'],['Elevação posterior','4','15'],['Abdominal curto (com peso)','5','25']],
C:[['Leg Press 45 graus','5','12'],['Cadeira extensora','5','12'],['Cadeira flexora','8','12'],['Cadeira abdutora','5','12'],['Panturrilha em pé','5','15']],
D:[['Rosca direta com barra W','4','15'],['Rosca Scott','4','15'],['Rosca alternada (mais peso)','3','8'],['Tríceps na polia','4','15'],['Tríceps testa com barra','4','15'],['Tríceps francês (mais peso)','3','8'],['Rosca punho','4','15']],
E:[['Supino reto com barra','4','12'],['Elevação lateral','5','12'],['Puxada alta','4','12'],['Cadeira extensora','4','12'],['Cadeira flexora','4','12'],['Panturrilha em pé','5','15'],['Abdominal curto','4','25'],['Abdominal inferior','4','25'],['Abdominal remador','4','25']]
};
const IMGS={
 'Peck deck':'peckdeck','Supino com halteres':'supino_halteres','Supino inclinado com barra':'supino_inclinado_barra','Flexão no chão':'flexao_chao','Desenvolvimento militar':'desenvolvimento_militar','Elevação lateral':'elevacao_lateral','Elevação frontal':'elevacao_frontal',
 'Barra fixa':'barra_fixa','Puxada alta':'puxada_alta','Remada baixa':'remada_baixa','Remada unilateral (mais peso)':'remada_unilateral','Encolhimento':'encolhimento','Elevação posterior':'elevacao_posterior','Abdominal curto (com peso)':'abdc_curto',
 'Leg Press 45 graus':'legpress','Cadeira extensora':'cadeira_extensora','Cadeira flexora':'cadeira_flexora','Cadeira abdutora':'cadeira_abdutora','Panturrilha em pé':'panturrilha_pe',
 'Rosca direta com barra W':'rosca_w','Rosca Scott':'rosca_scott','Rosca alternada (mais peso)':'rosca_alternada','Tríceps na polia':'triceps_polia','Tríceps testa com barra':'triceps_testa','Tríceps francês (mais peso)':'triceps_frances','Rosca punho':'rosca_punho',
 'Supino reto com barra':'supino_reto_barra','Abdominal curto':'abdc_curto','Abdominal inferior':'abdc_inferior','Abdominal remador':'abdc_remador'
};
function novoItem(nome,series,reps){return{id:id(),nome:nome,series:series,reps:reps,img:IMGS[nome]?('img/'+IMGS[nome]):''}}
function imgDe(ex){if(ex.img)return ex.img;return IMGS[ex.nome]?('img/'+IMGS[ex.nome]):''}
function fotoPropria(ex){return typeof ex.img==='string'&&ex.img.indexOf('data:')===0}
function carregarFoto(ex,inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const ehGif= /image\/gif|\.gif$/i.test(f.type||f.name);
  if(ehGif){
    if(f.size>1800000){alert('GIF muito grande (máx. 1,8 MB).');inp.value='';return}
    const rd=new FileReader();
    rd.onload=function(){ex.img=String(rd.result);inp.value='';salvar();render()};
    rd.readAsDataURL(f);
    return;
  }
  const img=new Image(),url=URL.createObjectURL(f);
  img.onload=function(){
    const max=360;let w=img.width||max,h=img.height||max;
    if(w>h&&w>max){h=Math.round(h*max/w);w=max}else if(h>max){w=Math.round(w*max/h);h=max}
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    ex.img=c.toDataURL('image/jpeg',0.72);
    URL.revokeObjectURL(url);
    salvar();render();
  };
  img.onerror=function(){URL.revokeObjectURL(url)};
  img.src=url;inp.value='';
}
function abrirImagem(ex){
  const src=imgDe(ex);if(!src)return;
  document.getElementById('imgGrande').src=src;
  document.getElementById('imgGrande').alt=ex.nome;
  document.getElementById('imgLegenda').textContent=ex.nome;
  document.getElementById('modalImg').hidden=false;
}
document.getElementById('btnFecharImg').onclick=function(){document.getElementById('modalImg').hidden=true};
document.getElementById('modalImg').addEventListener('click',function(e){if(e.target===this)this.hidden=true});
let dados, treinoAtual='A', editando=false, focarNovo=false;
let usuario=null, FB=null, modoCadastro=false, envioTimer=null;

function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function hoje(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtData(iso){const p=iso.split('-');return p[2]+'/'+p[1]}
function fmtNum(n){return Number(n).toLocaleString('pt-BR',{maximumFractionDigits:1})}
function fmtPeso(n){return fmtNum(n)+' kg'}
function pesosDoRegistro(e){return Array.isArray(e.ps)?e.ps.filter(function(x){return x!=null}):((e&&e.p!=null)?[e.p]:[])}
function maxRegistro(e){const ps=pesosDoRegistro(e);return ps.length?Math.max.apply(null,ps):(e&&e.p!=null?Number(e.p):0)}
function fmtRegistro(e){const ps=pesosDoRegistro(e);if(!ps.length)return fmtPeso(e.p);const mn=Math.min.apply(null,ps),mx=Math.max.apply(null,ps);return mn===mx?fmtPeso(mx):fmtNum(mn)+'–'+fmtNum(mx)+' kg'}
function nSeriesDe(ex){return Math.max(1,Math.min(12,parseInt(ex.series,10)||1))}
function salvarSerie(ex,idx,bruto){
  const hj=hoje(), n=nSeriesDe(ex);
  const v=String(bruto).trim().replace(',','.');
  let p=null;
  if(v!==''){p=parseFloat(v);if(isNaN(p)||p<0)return}
  if(!dados.pesos[ex.id])dados.pesos[ex.id]={nome:ex.nome,hist:[]};
  const reg=dados.pesos[ex.id];
  reg.nome=ex.nome;
  let entry=null;
  for(let i=0;i<reg.hist.length;i++){if(reg.hist[i].d===hj){entry=reg.hist[i];break}}
  if(!entry&&p===null)return;
  if(!entry){entry={d:hj,ps:[],t:Date.now()};reg.hist.push(entry)}
  if(!Array.isArray(entry.ps))entry.ps=(entry.p!=null)?[entry.p]:[];
  while(entry.ps.length<idx+1)entry.ps.push(null);
  entry.ps[idx]=p;
  if(entry.ps.length>n)entry.ps.length=n;
  while(entry.ps.length&&entry.ps[entry.ps.length-1]===null)entry.ps.pop();
  const nums=entry.ps.filter(function(x){return x!=null});
  if(!nums.length){
    reg.hist=reg.hist.filter(function(x){return x.d!==hj});
  }else{
    entry.p=Math.max.apply(null,nums);
    entry.t=Date.now();
    reg.hist.sort(function(a,b){return a.d<b.d?-1:1});
  }
  salvar(); render();
}
function temConfig(){return !!(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey)}
function treinosVazios(){const o={};ORDEM.forEach(function(t){o[t]=[]});return o}
function novoModelo(){const o={};ORDEM.forEach(function(t){o[t]=PADRAO[t].map(function(e){return novoItem(e[0],e[1],e[2])})});return o}
function treinosVaziosCompletos(){return ORDEM.every(function(t){const a=dados.treinos[t];return !a||!a.length})}
const JAPERG='modelo_ja_perguntado';
function perguntarModelo(){
  if(localStorage.getItem(JAPERG))return;
  localStorage.setItem(JAPERG,'1');
  if(treinosVaziosCompletos()&&confirm('Sua conta está vazia. Carregar o modelo de treino A–E para começar?')){
    dados.treinos=novoModelo();
    salvarLocal(); render(); enviarNuvem();
  }
}
function localPuroModelo(){
  if(Object.keys(dados.pesos).length)return false;
  const dias=Object.keys(dados.progresso);
  for(let i=0;i<dias.length;i++){
    const t=dados.progresso[dias[i]];
    for(const k in t){if(Array.isArray(t[k])&&t[k].length)return false}
  }
  return ORDEM.every(function(t){
    const a=dados.treinos[t];
    if(!Array.isArray(a)||a.length!==PADRAO[t].length)return false;
    return PADRAO[t].every(function(e,i){return a[i]&&a[i].nome===e[0]&&a[i].series===e[1]&&a[i].reps===e[2]});
  });
}

function carregar(){
  let j=null;
  try{j=JSON.parse(localStorage.getItem(CHAVE))}catch(e){}
  if(!j){
    try{j=JSON.parse(localStorage.getItem('academia_v2'))}catch(e){}
  }
  if(!j||!j.treinos)j={treinos:{},progresso:{}};
  ORDEM.forEach(function(t){
    if(!Array.isArray(j.treinos[t]))j.treinos[t]=PADRAO[t].map(function(e){return novoItem(e[0],e[1],e[2])});
  });
  if(!j.progresso||typeof j.progresso!=='object')j.progresso={};
  if(!j.pesos||typeof j.pesos!=='object')j.pesos={};
  const h=hoje();
  j.progresso=j.progresso[h]?{[h]:j.progresso[h]}:{};
  return j;
}
function podar(){
  const lim=new Date(Date.now()-60*864e5).toISOString().slice(0,10);
  Object.keys(dados.progresso).forEach(function(d){if(d<lim)delete dados.progresso[d]});
  Object.keys(dados.pesos).forEach(function(k){
    const h=dados.pesos[k];
    if(h&&Array.isArray(h.hist)){h.hist.sort(function(a,b){return a.d<b.d?-1:1});if(h.hist.length>200)h.hist=h.hist.slice(-200)}
  });
}
function salvarLocal(){podar();try{localStorage.setItem(CHAVE,JSON.stringify(dados))}catch(e){}}
function salvar(){salvarLocal();agendarEnvio()}
function feitos(){
  const h=hoje();
  if(!dados.progresso[h])dados.progresso[h]={};
  if(!Array.isArray(dados.progresso[h][treinoAtual]))dados.progresso[h][treinoAtual]=[];
  return dados.progresso[h][treinoAtual];
}
function itens(){return dados.treinos[treinoAtual].filter(function(e){return e.nome.trim()})}
function atualizaProgresso(){
  const total=itens().length, n=feitos().filter(function(f){return itens().some(function(e){return e.id===f})}).length;
  const pct=total?Math.round(n/total*100):0;
  document.getElementById('barraFill').style.width=pct+'%';
  document.getElementById('progTexto').textContent=n+'/'+total+' ('+pct+'%)';
}
function render(){
  document.getElementById('nomeTreino').textContent='Treino '+treinoAtual+' — '+NOMES[treinoAtual];
  const lista=document.getElementById('lista');
  lista.innerHTML='';
  const arr=dados.treinos[treinoAtual], feitosArr=feitos();
  const visiveis=arr.filter(function(e){return e.nome.trim()});
  if(!visiveis.length&&!editando){
    const d=document.createElement('div');
    d.className='vazio';
    d.textContent=usuario?'Nenhum exercício ainda. Toque em Editar para adicionar.':'Nenhum exercício ainda. Entre na conta para montar seu treino.';
    lista.appendChild(d);
  }
  arr.forEach(function(ex){
    const li=document.createElement('li');
    li.className='item'+(feitosArr.indexOf(ex.id)>-1?' done':'');
    const chk=document.createElement('button');
    chk.className='check';
    chk.textContent='✓';
    chk.setAttribute('aria-label','Marcar '+ex.nome);
    chk.onclick=function(){
      const f=feitos(), i=f.indexOf(ex.id);
      if(i>-1)f.splice(i,1); else f.push(ex.id);
      salvar(); render();
    };
    const info=document.createElement('div');
    info.className='info';
    info.innerHTML='<div class="nome"></div><div class="linha2"><span class="meta"></span></div>';
    info.querySelector('.nome').textContent=ex.nome;
    info.querySelector('.meta').textContent=(ex.series?ex.series+' x ':'')+ex.reps;
    const reg=dados.pesos[ex.id];
    if(reg&&Array.isArray(reg.hist)&&reg.hist.length){
      const ult=reg.hist[reg.hist.length-1];
      const b=document.createElement('button');
      b.className='histbtn';
      b.textContent='Últ '+fmtRegistro(ult)+(ult.d!==hoje()?' · '+fmtData(ult.d):'');
      b.onclick=function(){abrirHistorico(ex)};
      info.querySelector('.linha2').appendChild(b);
    }
    const hj=hoje();
    const hojeReg=reg&&Array.isArray(reg.hist)?reg.hist.find(function(x){return x.d===hj}):null;
    const psAtual=hojeReg&&Array.isArray(hojeReg.ps)?hojeReg.ps:((hojeReg&&hojeReg.p!=null)?[hojeReg.p]:[]);
    const sp=document.createElement('div');
    sp.className='seriespeso';
    const nS=nSeriesDe(ex);
    for(let s=0;s<nS;s++){
      const lab=document.createElement('span');
      lab.className='sp';
      const num=document.createElement('b');
      num.textContent=String(s+1);
      const inp=document.createElement('input');
      inp.type='text'; inp.inputMode='decimal'; inp.placeholder='kg';
      inp.setAttribute('aria-label','Peso da série '+(s+1)+' de '+ex.nome);
      const val=psAtual[s];
      inp.value=(val==null||val==='')?'':String(val).replace('.',',');
      (function(idx,el){el.onchange=function(){salvarSerie(ex,idx,el.value)}})(s,inp);
      lab.appendChild(num); lab.appendChild(inp); sp.appendChild(lab);
    }
    const ed=document.createElement('div');
    ed.className='edicao';
    ed.innerHTML='<div class="linha1"><input class="nomei" placeholder="Nome do exercício"><input class="s" placeholder="Séries" inputmode="numeric"><input class="r" placeholder="Repetições"></div><button class="del">Remover</button>';
    const inpFoto=document.createElement('input');
    inpFoto.type='file'; inpFoto.accept='image/*'; inpFoto.style.display='none';
    const btnFoto=document.createElement('button');
    btnFoto.type='button'; btnFoto.className='foto';
    btnFoto.textContent=fotoPropria(ex)?'Trocar foto':'Foto';
    btnFoto.setAttribute('aria-label','Adicionar foto de '+ex.nome);
    btnFoto.onclick=function(){inpFoto.click()};
    inpFoto.onchange=function(){carregarFoto(ex,inpFoto)};
    ed.appendChild(inpFoto); ed.appendChild(btnFoto);
    if(fotoPropria(ex)){
      const bp=document.createElement('button');
      bp.type='button'; bp.className='foto delFoto';
      bp.textContent='Remover foto';
      bp.onclick=function(){delete ex.img;salvar();render()};
      ed.appendChild(bp);
    }
    const inNome=ed.querySelector('.nomei'), inS=ed.querySelector('.s'), inR=ed.querySelector('.r');
    inNome.value=ex.nome; inS.value=ex.series; inR.value=ex.reps;
    inNome.oninput=function(){ex.nome=inNome.value;salvar()};
    inS.oninput=function(){ex.series=inS.value;salvar()};
    inR.oninput=function(){ex.reps=inR.value;salvar()};
    inNome.onblur=atualizaProgresso; inS.onblur=render; inR.onblur=render;
    ed.querySelector('.del').onclick=function(){
      dados.treinos[treinoAtual]=dados.treinos[treinoAtual].filter(function(e){return e.id!==ex.id});
      const f=feitos(), i=f.indexOf(ex.id); if(i>-1)f.splice(i,1);
      delete dados.pesos[ex.id];
      salvar(); render();
    };
    li.appendChild(chk);
    if(imgDe(ex)){
      const tb=document.createElement('button');
      tb.className='thumb'; tb.type='button';
      tb.setAttribute('aria-label','Ver foto de '+ex.nome);
      const ti=document.createElement('img');
      ti.src=imgDe(ex); ti.alt=ex.nome;
      ti.loading='lazy';
      tb.appendChild(ti);
      tb.onclick=function(){abrirImagem(ex)};
      li.appendChild(tb);
    }
    li.appendChild(info); li.appendChild(sp); li.appendChild(ed);
    lista.appendChild(li);
    if(editando&&focarNovo&&ex===arr[arr.length-1])setTimeout(function(){inNome.focus()},0);
  });
  focarNovo=false;
  atualizaProgresso();
}
function abrirHistorico(ex){
  const reg=dados.pesos[ex.id];
  document.getElementById('histTitulo').textContent='Evolução — '+ex.nome;
  const box=document.getElementById('histLista');
  box.innerHTML='';
  if(!reg||!Array.isArray(reg.hist)||!reg.hist.length){
    box.innerHTML='<div class="muted">Nenhum peso registrado ainda.</div>';
  }else{
    const h=reg.hist.slice().sort(function(a,b){return a.d<b.d?-1:1});
    for(let i=h.length-1;i>=0;i--){
      const linha=document.createElement('div');
      linha.className='histlinha';
      const d=document.createElement('span'); d.className='d'; d.textContent=fmtData(h[i].d);
      const p=document.createElement('span'); p.className='p'; p.textContent=fmtRegistro(h[i]);
      linha.appendChild(d);
      if(i>0){
        const delta=maxRegistro(h[i])-maxRegistro(h[i-1]);
        const s=document.createElement('span');
        if(Math.abs(delta)<0.01){s.className='flat';s.textContent='—'}
        else{const up=delta>0;s.className=up?'up':'down';s.textContent=(up?'+':'')+fmtPeso(delta)}
        linha.appendChild(s);
      }
      linha.appendChild(p);
      box.appendChild(linha);
    }
  }
  document.getElementById('modalHist').hidden=false;
}
document.getElementById('btnFecharHist').onclick=function(){document.getElementById('modalHist').hidden=true};
document.getElementById('modalHist').addEventListener('click',function(e){if(e.target===this)this.hidden=true});

document.getElementById('abas').addEventListener('click',function(ev){
  const b=ev.target.closest('.aba'); if(!b)return;
  treinoAtual=b.dataset.t;
  document.querySelectorAll('.aba').forEach(function(a){a.classList.toggle('ativa',a===b)});
  render();
});
document.getElementById('btnEditar').onclick=function(){
  editando=!editando;
  if(!editando){
    dados.treinos[treinoAtual]=dados.treinos[treinoAtual].filter(function(e){return e.nome.trim()});
    salvar();
  }
  document.body.classList.toggle('editando',editando);
  this.textContent=editando?'Concluir':'Editar';
  render();
};
document.getElementById('btnAdicionar').onclick=function(){
  dados.treinos[treinoAtual].push({id:id(),nome:'',series:'',reps:''});
  focarNovo=true; salvar(); render();
};
document.getElementById('btnModelo').onclick=function(){
  if(!confirm('Substituir todos os seus treinos pelo modelo A–E? Marcações e pesos serão apagados.'))return;
  dados.treinos=novoModelo();
  dados.progresso={};
  dados.pesos={};
  salvar(); render();
};
document.getElementById('btnLimpar').onclick=function(){
  if(!confirm('Limpar as marcações de hoje do Treino '+treinoAtual+'?'))return;
  feitos().length=0; salvar(); render();
};
document.getElementById('dataTexto').textContent=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});

function erroComCodigo(c){const e=new Error(c);e.code=c;return e}
async function getFB(){
  if(FB)return FB;
  const cfg=window.FIREBASE_CONFIG||{};
  if(!cfg.apiKey)throw erroComCodigo('sem-config');
  let A,U,F;
  try{
    [A,U,F]=await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js'),
      import('https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js')
    ]);
  }catch(e){throw erroComCodigo('sem-conexao')}
  const app=A.initializeApp(cfg);
  FB={auth:U.getAuth(app),db:F.getFirestore(app),U:U,F:F};
  return FB;
}
function msgErro(e){
  const c=(e&&e.code)||'';
  const mapa={
    'auth/invalid-credential':'E-mail ou senha incorretos',
    'auth/wrong-password':'E-mail ou senha incorretos',
    'auth/user-not-found':'E-mail ou senha incorretos',
    'auth/email-already-in-use':'Este e-mail já está cadastrado',
    'auth/weak-password':'Senha muito fraca (mínimo 6 caracteres)',
    'auth/invalid-email':'E-mail inválido',
    'auth/missing-password':'Digite a senha',
    'auth/network-request-failed':'Sem conexão com a internet',
    'auth/popup-blocked':'O navegador bloqueou a janela de login — tentando novamente',
    'auth/popup-closed-by-user':'Login cancelado',
    'auth/cancelled-popup-request':'Login cancelado',
    'auth/unauthorized-domain':'Domínio não autorizado no Firebase',
    'sem-config':'Login ainda não configurado',
    'sem-conexao':'Sem conexão para entrar. Tente novamente.'
  };
  return mapa[c]||'Não foi possível entrar. Tente novamente.';
}
function sairDoModoEdicao(){
  editando=false;
  document.body.classList.remove('editando');
  document.getElementById('btnEditar').textContent='Editar';
}
function atualizaBotaoConta(){
  const b=document.getElementById('btnConta');
  document.getElementById('btnEditar').hidden=!usuario;
  if(!usuario&&editando)sairDoModoEdicao();
  if(!temConfig()){b.hidden=true;return}
  b.hidden=false;
  if(usuario){
    b.classList.add('av');
    const inic=(usuario.displayName||usuario.email||'U').trim().charAt(0).toUpperCase();
    b.textContent=inic||'U';
  }else{
    b.classList.remove('av');
    b.textContent='Entrar';
  }
}
function montarDoc(){
  return {
    treinos:dados.treinos,
    progresso:dados.progresso,
    pesos:dados.pesos,
    nome:(usuario&&usuario.displayName)||'',
    email:(usuario&&usuario.email)||'',
    atualizadoEm:Date.now()
  };
}
function agendarEnvio(){
  if(!usuario)return;
  clearTimeout(envioTimer);
  envioTimer=setTimeout(enviarNuvem,800);
}
async function enviarNuvem(){
  if(!usuario)return;
  try{
    const fb=await getFB();
    await fb.F.setDoc(fb.F.doc(fb.db,'usuarios',usuario.uid),montarDoc(),{merge:true});
  }catch(e){}
}
function mesclarNuvem(c){
  if(c.treinos&&typeof c.treinos==='object'){
    ORDEM.forEach(function(t){
      dados.treinos[t]=Array.isArray(c.treinos[t])?c.treinos[t]:[];
    });
  }
  if(c.progresso){
    Object.keys(c.progresso).forEach(function(d){
      const rem=c.progresso[d];
      if(!rem||typeof rem!=='object')return;
      if(!dados.progresso[d])dados.progresso[d]={};
      Object.keys(rem).forEach(function(t){
        if(!Array.isArray(rem[t]))return;
        if(!Array.isArray(dados.progresso[d][t]))dados.progresso[d][t]=[];
        rem[t].forEach(function(x){if(dados.progresso[d][t].indexOf(x)<0)dados.progresso[d][t].push(x)});
      });
    });
  }
  if(c.pesos){
    Object.keys(c.pesos).forEach(function(exId){
      const nu=c.pesos[exId];
      if(!nu||!Array.isArray(nu.hist))return;
      if(!dados.pesos[exId])dados.pesos[exId]={nome:nu.nome||'',hist:[]};
      const meu=dados.pesos[exId];
      if(nu.nome)meu.nome=nu.nome;
      nu.hist.forEach(function(r){
        if(!r||typeof r.p!=='number')return;
        const i=meu.hist.findIndex(function(x){return x.d===r.d});
        if(i<0)meu.hist.push(r);
        else if((r.t||0)>=(meu.hist[i].t||0))meu.hist[i]=r;
      });
      meu.hist.sort(function(a,b){return a.d<b.d?-1:1});
    });
  }
}
async function baixarNuvem(){
  if(!usuario)return;
  try{
    const fb=await getFB();
    const snap=await fb.F.getDoc(fb.F.doc(fb.db,'usuarios',usuario.uid));
    if(snap.exists()){
      mesclarNuvem(snap.data()||{});
      salvarLocal(); render();
    }else{
      if(localPuroModelo()){
        dados.treinos=treinosVazios();
        dados.progresso={};
        dados.pesos={};
        salvarLocal(); render();
      }
      enviarNuvem();
    }
    perguntarModelo();
  }catch(e){}
}
async function iniciarAuth(){
  const fb=await getFB();
  fb.U.onAuthStateChanged(fb.auth,function(u){
    usuario=u;
    atualizaBotaoConta();
    render();
    if(u)baixarNuvem();
  });
}
document.getElementById('btnConta').onclick=function(){
  if(usuario){abrirPerfil()}else{abrirLogin()}
};
function abrirPerfil(){
  document.getElementById('perfilAvatar').textContent=(usuario.displayName||usuario.email||'U').trim().charAt(0).toUpperCase()||'U';
  document.getElementById('perfilNome').textContent=usuario.displayName||'(sem nome)';
  document.getElementById('perfilEmail').textContent=usuario.email||'';
  document.getElementById('modalPerfil').hidden=false;
}
function abrirLogin(){
  document.getElementById('loginErro').textContent='';
  document.getElementById('modalLogin').hidden=false;
}
document.getElementById('btnFecharPerfil').onclick=function(){document.getElementById('modalPerfil').hidden=true};
document.getElementById('modalPerfil').addEventListener('click',function(e){if(e.target===this)this.hidden=true});
document.getElementById('btnSair').onclick=async function(){
  document.getElementById('modalPerfil').hidden=true;
  try{const fb=await getFB();await fb.U.signOut(fb.auth)}catch(e){}
  usuario=null; atualizaBotaoConta();
};
document.getElementById('btnSemConta').onclick=function(){document.getElementById('modalLogin').hidden=true};
document.getElementById('modalLogin').addEventListener('click',function(e){if(e.target===this)this.hidden=true});
document.getElementById('btnAlternar').onclick=function(){
  modoCadastro=!modoCadastro;
  document.getElementById('inNome').hidden=!modoCadastro;
  document.getElementById('btnEmail').textContent=modoCadastro?'Criar conta':'Entrar';
  this.textContent=modoCadastro?'Já tenho conta':'Criar conta';
  document.getElementById('inSenha').setAttribute('autocomplete',modoCadastro?'new-password':'current-password');
  document.getElementById('loginErro').textContent='';
};
document.getElementById('btnEmail').onclick=async function(){
  const erroEl=document.getElementById('loginErro');
  const email=document.getElementById('inEmail').value.trim();
  const senha=document.getElementById('inSenha').value;
  erroEl.textContent='';
  if(!email||!senha){erroEl.textContent='Preencha e-mail e senha';return}
  try{
    const fb=await getFB();
    if(modoCadastro){
      const r=await fb.U.createUserWithEmailAndPassword(fb.auth,email,senha);
      const nome=document.getElementById('inNome').value.trim();
      if(nome)await fb.U.updateProfile(r.user,{displayName:nome});
    }else{
      await fb.U.signInWithEmailAndPassword(fb.auth,email,senha);
    }
    document.getElementById('modalLogin').hidden=true;
  }catch(e){erroEl.textContent=msgErro(e)}
};
document.getElementById('btnGoogle').onclick=async function(){
  const erroEl=document.getElementById('loginErro');
  erroEl.textContent='';
  try{
    const fb=await getFB();
    const prov=new fb.U.GoogleAuthProvider();
    try{
      await fb.U.signInWithPopup(fb.auth,prov);
      document.getElementById('modalLogin').hidden=true;
    }catch(e){
      const c=(e&&e.code)||'';
      if(c==='auth/popup-blocked'||c==='auth/operation-not-allowed'){
        await fb.U.signInWithRedirect(fb.auth,prov);
      }else if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request'){
        erroEl.textContent='Login cancelado';
      }else throw e;
    }
  }catch(e){erroEl.textContent=msgErro(e)}
};

let promptInstalar=null;
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault(); promptInstalar=e;
  document.getElementById('btnInstalar').hidden=false;
});
document.getElementById('btnInstalar').onclick=async function(){
  if(!promptInstalar)return;
  promptInstalar.prompt(); await promptInstalar.userChoice;
  promptInstalar=null; this.hidden=true;
};
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}

dados=carregar(); salvarLocal(); render(); atualizaBotaoConta();
if(temConfig()){
  iniciarAuth().catch(function(){
    document.getElementById('avisoConta').hidden=false;
  });
}
</script>
